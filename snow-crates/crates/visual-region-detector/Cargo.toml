[package]
name = "visual-region-detector"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
# The detector is usable on a stock Rust installation. `opencv` is an
# additive opt-in: when enabled it becomes the active primitive backend and
# the OpenCV adapter module is made available. File codecs and crop export
# are independently controlled by `file-io` for both backends.
default = ["pure-rust", "file-io"]
file-io = ["image/bmp", "image/jpeg", "image/png"]
pure-rust = []
opencv = ["dep:opencv"]

[dependencies]
snow-core = { path = "../snow-core" }
image = { version = "0.25", default-features = false }
opencv = { version = "0.100.1", optional = true, default-features = false, features = ["clang-runtime", "imgproc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "visual-region-detector"
path = "src/main.rs"
required-features = ["file-io"]
