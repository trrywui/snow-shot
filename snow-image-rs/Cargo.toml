[workspace]
members = [
  "crates/snow-image-core",
  "crates/snow-image-rs",
  "crates/snow-image-codecs",
  "crates/snow-image-native-sys",
  "crates/snow-image-protocol",
  "crates/snow-image-transport",
  "crates/snow-image-worker",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"

[workspace.dependencies]
snow-image-transport = { path = "crates/snow-image-transport" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
half = { version = "=2.7.1", features = ["serde"] }
tempfile = "=3.23.0"
memmap2 = "=0.9.12"
png = "=0.18.1"
gif = "=0.14.2"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "ico", "png"] }
libc = "=0.2.177"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_Security", "Win32_System_Memory"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.release.build-override]
# Preserve loadable host proc macros: stripping can misalign Mach-O LINKEDIT on macOS.
strip = "none"

[profile.performance]
inherits = "release"
debug = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
